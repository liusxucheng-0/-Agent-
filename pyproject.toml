[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-agent-proof"
version = "0.1.0"
description = "A runnable multi-agent workflow project for MiMo application proof."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mimo-agent-proof = "mimo_agent_proof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

